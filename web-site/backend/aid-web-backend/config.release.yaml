system:
  debug: true
  version: v1.0.0
  daemons: true
  timezone: 8
web-service:
  port: "8080"
  cors: true
  static-dir:
  - url: /web
    dir: resource/html/spa
  - url: /manager
    dir: resource/html/manager
log:
  daemons:
    dir: storage/runtime/log
    filename: daemons.log
  zap:
    level: debug
    encoder-type: console
    extension: .log
    in-console: true
    dir: storage/runtime/log/system
    max-size: 100
    max-day: 10
rezip:
  out-dir: storage/runtime/rezip
file-manager:
  port: "9901"
  dir: storage/runtime/file-manager
message-board:
  dir: storage/runtime/message-board
checking-in:
  tmp-dir: storage/runtime/checking-in
